<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>五城房产 · 历史趋势</title>
<style>
:root{--ink:#19342c;--muted:#60766e;--paper:#f4f6f2;--line:#dfe7df;--accent:#147a61}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 "Microsoft YaHei","Segoe UI",sans-serif}main{max-width:1440px;margin:auto;padding:34px 36px 60px}.eyebrow{font-size:12px;letter-spacing:3px;color:var(--accent);font-weight:700}header{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}h1{font-size:34px;margin:6px 0 4px;letter-spacing:-1px}h2{font-size:19px;margin:0 0 5px}h3{font-size:15px;margin:0}p{margin:8px 0}.sub{color:var(--muted);max-width:890px}a{color:#126852;text-decoration:none}a:hover{text-decoration:underline}.tag{border:1px solid var(--line);border-radius:20px;padding:5px 13px;font-size:12px;white-space:nowrap}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:25px 0 18px}button,select{font:inherit;border:1px solid #cedbd2;background:white;color:var(--ink);border-radius:7px;padding:7px 17px;cursor:pointer}button.active{background:var(--ink);border-color:var(--ink);color:white}button:hover{border-color:var(--accent)}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.tiny{font-size:12px;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.card,.panel{border:1px solid var(--line);background:white;border-radius:12px}.card{padding:16px 20px}.value{font-size:29px;font-weight:650;line-height:1.35;margin-top:5px}.unit{font-size:13px;font-weight:400;color:var(--muted)}.panel{padding:22px;margin-bottom:18px}.paneltop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.chartbox{position:relative;height:320px;margin:16px 0 6px}.wide .chartbox{height:360px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid .panel{margin:0}.note{font-size:13px;color:var(--muted);margin-top:12px}.caution{background:#f8f2e7;border-left:3px solid #be994f;padding:12px 16px;border-radius:4px;color:#705b32;margin:16px 0}.insight{background:#e9f2ec;padding:16px 20px;border-radius:8px;margin:18px 0}.smallbtn{font-size:12px;padding:4px 10px;white-space:nowrap}.tablewrap{overflow:auto;margin-top:14px;max-height:470px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}th{position:sticky;top:0;background:#eef3ee;font-weight:600}td.wrap{white-space:normal;min-width:190px}.foot{border-top:1px solid var(--line);padding-top:18px;margin-top:26px;color:var(--muted);font-size:12px}details{margin-top:18px}summary{cursor:pointer;font-weight:600}#error{color:#a12626;background:#fff;padding:20px;display:none}canvas{max-width:100%}@media(max-width:800px){main{padding:20px 16px}.grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}header{display:block}h1{font-size:27px}.tag{display:inline-block;margin-top:10px}.chartbox,.wide .chartbox{height:285px}.panel{padding:16px}.value{font-size:24px}}@media print{main{max-width:none;padding:0}.tabs,.toolbar,.smallbtn{display:none}.panel{break-inside:avoid}.grid{display:block}.chartbox{height:260px}body{background:white}}
</style></head><body><main>
<header><div><div class="eyebrow">REAL ESTATE / CYCLE MONITOR</div><h1>五城房产 · 历史趋势</h1><div class="sub">把房价、融资成本与成交活动放回历史中观察。与<a href="../宏观房产核心表.xlsx">宏观核心比较表 ↗</a>配合，判断何时买、在哪买。</div></div><span class="tag" id="date"></span></header>
<div id="error"></div><nav class="tabs" id="tabs" aria-label="城市选择"></nav>
<div class="toolbar"><span id="subtitle" class="sub"></span><div><label for="start">图表区间 </label><select id="start"><option value="2015">2015年以来</option><option value="2020">2020年以来</option><option value="2022">2022年以来</option></select> <button class="smallbtn" id="csv">导出全部数据 CSV</button></div></div>
<div id="content"></div>
<div class="foot">折线只连接已有观测；无平滑拟合、无预测。指标截止期不同，年度数据不延伸到当前月；筛选图区间不会改变“距高点”等全样本统计。房价为名义值，未扣通胀，也不含租金和交易成本。<br>半年核查一次 · 原始值、地域、物业范围及逐点来源随数据保留 · <a href="五城趋势分析.md">阅读分析报告</a></div>
</main><script>/*CHART_LIBRARY*/</script><script>
'use strict';
const D=/*DATA_PAYLOAD*/;
const CITIES=[['berlin','柏林','de_rate'],['munich','慕尼黑','de_rate'],['frankfurt','法兰克福','de_rate'],['nyc','纽约','us_rate'],['beijing','北京','cn_rate']];
const COLORS=['#1c826a','#477cc2','#aa7643','#9b579b','#d65b50'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(v,d=1)=>v==null?'暂无':Number(v).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d});
const signed=(v,d=1)=>v==null?'暂无':(v>0?'+':'')+num(v,d);
let city='all',charts=[];
const S=id=>D.series[id],src=p=>D.sources[p.source_id];
document.getElementById('date').textContent='核查日 '+D.updated_at;
document.getElementById('tabs').innerHTML=[['all','五城概览'],...CITIES].map(([id,name])=>'<button data-city="'+id+'" class="'+(id==='all'?'active':'')+'">'+name+'</button>').join('');
document.querySelectorAll('[data-city]').forEach(b=>b.onclick=()=>{city=b.dataset.city;document.querySelectorAll('[data-city]').forEach(t=>t.classList.toggle('active',t===b));render()});
document.getElementById('start').onchange=render;
Chart.defaults.font.family='"Microsoft YaHei","Segoe UI",sans-serif';
Chart.defaults.color='#64796f';
function points(s){return s.points.map(p=>({x:p.x,y:p.display,period:p.period,raw:p.value,source:p.source_id}))}
function chart(id,ids,unit,colors=COLORS){
 const ds=ids.map((key,i)=>{const s=S(key);return{label:s.city+' · '+s.label,data:points(s),borderColor:colors[i%colors.length],backgroundColor:colors[i%colors.length],borderWidth:2.3,pointRadius:s.points.length<60?2.5:0,pointHoverRadius:5,pointHitRadius:12,tension:0,spanGaps:{M:.09,Q:.26,A:1.01,H1:1.01,DEC:1.01,W:.035}[s.frequency]};});
 const c=new Chart(document.getElementById(id),{type:'line',data:{datasets:ds},options:{responsive:true,maintainAspectRatio:false,animation:false,parsing:false,interaction:{mode:'nearest',intersect:false},plugins:{legend:{display:ids.length>1,position:'bottom',labels:{boxWidth:14,font:{size:11}}},tooltip:{callbacks:{title:a=>a[0].raw.period,label:ctx=>ctx.dataset.label+'：'+num(ctx.raw.y,2)+' '+unit,afterLabel:ctx=>D.sources[ctx.raw.source].title}}},scales:{x:{type:'linear',min:Number(document.getElementById('start').value),max:Math.ceil(Math.max(...ids.flatMap(key=>S(key).points.map(p=>p.x)))),ticks:{stepSize:1,callback:v=>String(Math.round(v))},grid:{display:false}},y:{title:{display:true,text:unit},grace:'8%',ticks:{maxTicksLimit:6},grid:{color:'#e8eee8'}}}}});
 charts.push(c);return c;
}
function panel(id,title,subtitle,body,wide=false){return '<section class="panel '+(wide?'wide':'')+'"><div class="paneltop"><div><h2>'+title+'</h2><div class="tiny">'+subtitle+'</div></div><button class="smallbtn" data-export="'+id+'">保存图片</button></div><div class="chartbox"><canvas id="'+id+'" role="img" aria-label="'+esc(title)+'"></canvas></div><div class="note">'+body+'</div></section>'}
function sourceNote(s){const p=s.stats.last,ss=src(p);return esc(s.scope)+'。<br>'+esc(s.caveat)+'<br><a target="_blank" rel="noopener" href="'+esc(ss.url)+'">最新观测来源：'+esc(ss.title)+' ↗</a>'}
function card(label,value,detail,unit=''){return '<div class="card"><div class="tiny">'+label+'</div><div class="value">'+value+' <span class="unit">'+unit+'</span></div><div class="tiny">'+detail+'</div></div>'}
function all(){
 document.getElementById('subtitle').textContent='先看各自周期位置，再进入单城对照量、价、利率';
 const rows=CITIES.map(([k,n,r])=>{const p=S(k+'_price').stats,v=S(k+'_volume').stats,rr=S(r).stats;return '<tr><td>'+n+'</td><td>'+p.last.period+'</td><td>'+num(p.last.display)+'</td><td>'+signed(p.drawdown)+'%</td><td>'+signed(p.change)+'%</td><td>'+num(rr.last.value,2)+'% <small>('+rr.last.period+')</small></td><td>'+num(v.last.value,0)+' '+S(k+'_volume').unit+' <small>('+v.last.period+')</small></td></tr>'}).join('');
 document.getElementById('content').innerHTML='<div class="caution">跨城图只展示各自走势。纽约是一户住宅中位价，其余为价格指数；统一基期不消除物业与方法差异，不能据此直接给城市收益排名。</div>'+panel('overview','房价变化：2015年平均 = 100','德国季度 · 北京月度 · 纽约年度；悬停查看原统计期','德国：GREIX公寓成交指数；北京：二手住宅月环比链式指数；纽约：一户住宅成交中位价。年度点放在年中、季度点放在季度中点，仅为时间定位。',true)+'<section class="panel"><h2>最新观测与历史位置</h2><div class="tiny">距高点仅针对2015年以来已收录样本；同比按同一序列、同一频率计算。</div><div class="tablewrap"><table><thead><tr><th>城市</th><th>房价统计期</th><th>房价指数</th><th>距样本高点</th><th>房价同比</th><th>全国房贷参考</th><th>成交量（口径不同）</th></tr></thead><tbody>'+rows+'</tbody></table></div></section><div class="insight"><strong>使用顺序</strong><br>进入单城检查价格是否趋稳、成交是否恢复，再结合静态核心表的租售比、收入与人口条件，以及实际贷款报价。利率下降或价格回落本身不构成买入信号。</div>';
 chart('overview',CITIES.map(x=>x[0]+'_price'),'2015平均=100');
}
function single(){
 const [key,name,rate]=CITIES.find(c=>c[0]===city),p=S(key+'_price'),r=S(rate),v=S(key+'_volume');
 document.getElementById('subtitle').textContent=name+'｜三条时间线，分别观察，不混用单位';
 const ps=p.stats,rs=r.stats,vs=v.stats;
 let content='<div class="cards">'+card('房价最新观测 · '+ps.last.period,num(ps.last.display),'较上年同期 '+signed(ps.change)+'%','2015=100')+card('距样本内房价高点',signed(ps.drawdown)+'%','高点 '+ps.peak.period+' · '+num(ps.peak.display))+card('全国房贷参考 · '+rs.last.period,num(rs.last.value,2)+'%','较可比上年期 '+signed(rs.change,2)+' 个百分点')+card(v.label+' · '+vs.last.period,num(vs.last.value,v.unit==='万平方米'?1:0),'较上年同期间 '+signed(vs.change)+'%'+(key==='munich'?'（跨版本约数）':''),v.unit)+'</div>';
 content+=panel('price',name+' · '+p.label,'2015年平均=100；月/季/年原频率，名义价格',sourceNote(p),true);
 content+='<div class="grid">'+panel('rate',r.label,r.frequency==='DEC'?'每年12月观测 · 不是全年平均':'全国融资环境参考 · 不是城市报价',sourceNote(r))+panel('volume',v.label,v.frequency==='H1'?'各年1—6月 · 不年化':'完整年度 · 不与部分年度混接',sourceNote(v))+'</div>';
 content+='<div class="insight"><strong>解读与下一步</strong><br>'+esc(D.city_insights[key])+'</div>';
 if(key==='beijing')content+='<div class="caution">北京房价为二手住宅，成交量为新建住宅销售面积，两者不能直接用于检验同一市场的量价关系；二手房网签历史量仍待补齐。</div>';
 const selected=[p,r,v];
 content+='<details class="panel"><summary>查看逐期原始值与来源</summary><div class="tablewrap"><table><thead><tr><th>指标</th><th>期间</th><th>原始值</th><th>单位</th><th>来源</th><th>备注</th></tr></thead><tbody>'+selected.flatMap(s=>[...s.points].reverse().map(x=>'<tr><td>'+esc(s.label)+'</td><td>'+x.period+'</td><td>'+num(x.value,2)+'</td><td>'+esc(s.unit)+'</td><td><a target="_blank" rel="noopener" href="'+esc(src(x).url)+'">'+esc(src(x).title)+'</a></td><td class="wrap">'+esc(x.note||'')+'</td></tr>')).join('')+'</tbody></table></div></details>';
 document.getElementById('content').innerHTML=content;
 chart('price',[key+'_price'],'2015平均=100');chart('rate',[rate],'%',['#b17b36']);chart('volume',[key+'_volume'],v.unit,['#547fac']);
}
function render(){charts.forEach(c=>c.destroy());charts=[];if(city==='all')all();else single();document.querySelectorAll('[data-export]').forEach(b=>b.onclick=()=>{const canvas=document.getElementById(b.dataset.export),out=document.createElement('canvas');out.width=canvas.width;out.height=canvas.height;const cx=out.getContext('2d');cx.fillStyle='white';cx.fillRect(0,0,out.width,out.height);cx.drawImage(canvas,0,0);const a=document.createElement('a');a.download=city+'_'+b.dataset.export+'.png';a.href=out.toDataURL('image/png');a.click()})}
document.getElementById('csv').onclick=()=>{const rows=[['series_id','city','metric','period','value','unit','frequency','scope','source_url','accessed_at','note']];Object.entries(D.series).forEach(([id,s])=>s.points.forEach(p=>rows.push([id,s.city,s.metric,p.period,p.value,s.unit,s.frequency,s.scope,src(p).url,src(p).accessed_at,p.note||''])));const q=x=>'"'+String(x??'').replace(/"/g,'""')+'"';const blob=new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='五城历史数据.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
try{render()}catch(e){const el=document.getElementById('error');el.style.display='block';el.textContent='图表加载失败：'+e.message;throw e}
</script></body></html>
